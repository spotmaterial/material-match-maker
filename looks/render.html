<script type="module">
import * as THREE from 'three';

const SIZE = 640, TW = 1024, TH = 512;
// ---------- noise (seamless around the sphere: sampled on a cylinder) ----------
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const perm = new Uint8Array(512); { const r = rng(7); const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function hash3(x, y, z) { return perm[(perm[(perm[x & 255] + y) & 255] + z) & 255] / 255; }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = fade(xf), v = fade(yf), w = fade(zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  return lerp(lerp(lerp(c(0,0,0), c(1,0,0), u), lerp(c(0,1,0), c(1,1,0), u), v), lerp(lerp(c(0,0,1), c(1,0,1), u), lerp(c(0,1,1), c(1,1,1), u), v), w);
}
function fbm(x, y, z, oct = 4) { let a = 0, amp = 0.5, f = 1; for (let i = 0; i < oct; i++) { a += amp * vnoise(x * f, y * f, z * f); f *= 2; amp *= 0.5; } return a / (1 - Math.pow(0.5, oct)); }
// worley (cell) noise, F1 distance
function worley(x, y, z) {

  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
    const X = xi + a, Y = yi + b, Z = zi + c;
    const px = X + hash3(X, Y, Z), py = Y + hash3(Y + 17, Z, X), pz = Z + hash3(Z + 31, X, Y);
    const dd = (px - x) ** 2 + (py - y) ** 2 + (pz - z) ** 2; if (dd < d) d = dd;
  }

}
// cylinder coordinates for pixel (u,v), scale = features around the equator
function cyl(u, v, scale) { const r = scale / (2 * Math.PI); const a = u * 2 * Math.PI; return [Math.cos(a) * r, Math.sin(a) * r, v * scale * TH / TW]; }

// ---------- canvas helpers ----------
function canvas(w = TW, h = TH) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function pixels(fn) { // fn(u,v) -> [r,g,b] 0..255 ; returns canvas
  const c = canvas(), ctx = c.getContext('2d'), img = ctx.createImageData(TW, TH), d = img.data;
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) { const [r, g, b] = fn(x / TW, y / TH); const i = (y * TW + x) * 4; d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255; }
  ctx.putImageData(img, 0, 0); return c;
}
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const gray = t => { const g = Math.max(0, Math.min(255, t * 255)); return [g, g, g]; };
const clamp01 = t => Math.max(0, Math.min(1, t));
// draw strokes that wrap horizontally
function wrapStroke(ctx, draw) { for (const dx of [-TW, 0, TW]) { ctx.save(); ctx.translate(dx, 0); draw(); ctx.restore(); } }

// ---------- surface recipes: return { map, bump, bumpScale, rough(canvas)?, mat:{...} } ----------
const R = {};
R['solid-wood'] = () => {
  const light = hex('#c8955c'), dark = hex('#8a5a2e');
  const g = (u, v) => { const [x,y,z] = cyl(u, v, 5); const w = fbm(x*0.5, y*0.5, z*0.5, 4); return Math.sin(2*Math.PI*(v*22 + w*2.6 + Math.sin(u*2*Math.PI)*0.35)); };
  const f = (u, v) => { const [x,y,z] = cyl(u, v, 5); const t = Math.pow(0.5+0.5*g(u,v), 2.5); const n = fbm(x*10,y*10,z*10,3); return mix(mix(light, dark, t*0.7), dark, n*0.18); };
  const map = pixels(f); const bump = pixels((u,v) => gray(0.5+0.5*g(u,v)));
  return { map, bump, bumpScale: 0.6, mat: { roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.4 } };
};
R['plywood'] = () => {
  const light = hex('#e3c79a'), dark = hex('#c49a62');
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,5); const w = fbm(x*0.7,y*0.7,z*0.7,4); const s = Math.sin(2*Math.PI*(v*34 + w*4)); const t = Math.pow(0.5+0.5*s, 4); return mix(light, dark, t*0.5 + fbm(x*8,y*8,z*8,2)*0.12); });
  return { map, bump: map, bumpScale: 0.25, mat: { roughness: 0.6 } };
};
R['wood-board'] = () => { // OSB-like strands
  const c = canvas(), ctx = c.getContext('2d'); ctx.fillStyle = '#b98c55'; ctx.fillRect(0,0,TW,TH); const r = rng(3);
  for (let i = 0; i < 2600; i++) { const x = r()*TW, y = r()*TH, w = 40+r()*90, h = 8+r()*14, a = r()*Math.PI; const tone = 150 + r()*70;
    wrapStroke(ctx, () => { ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle = `rgb(${tone+30},${tone},${tone*0.62})`; ctx.fillRect(-w/2,-h/2,w,h); ctx.strokeStyle = 'rgba(90,60,30,0.25)'; ctx.strokeRect(-w/2,-h/2,w,h); }); }
  return { map: c, bump: c, bumpScale: 0.5, mat: { roughness: 0.8 } };
};
R['fibre-board'] = () => { // wood wool / natural fibre insulation
  const c = canvas(), ctx = c.getContext('2d'); ctx.fillStyle = '#8f7350'; ctx.fillRect(0,0,TW,TH); const r = rng(11);
  for (let i = 0; i < 2200; i++) { const x = r()*TW, y = r()*TH, len = 40+r()*80, a = r()*Math.PI*2, t = 160+r()*70;
    wrapStroke(ctx, () => { ctx.strokeStyle = `rgb(${t+25},${t},${t*0.65})`; ctx.lineWidth = 2+r()*3; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+Math.cos(a+0.5)*len*0.6, y+Math.sin(a+0.5)*len*0.6, x+Math.cos(a)*len, y+Math.sin(a)*len); ctx.stroke(); }); }
  return { map: c, bump: c, bumpScale: 1.2, mat: { roughness: 0.95 } };
};
R['cork'] = () => {
  const a = hex('#a4703f'), b = hex('#6e4422'), cc = hex('#c99766');
  const f = (u, v) => { const [x,y,z] = cyl(u,v,70); const w = worley(x,y,z); const n = fbm(x*0.5,y*0.5,z*0.5,3); return w < 0.35 ? mix(b, a, w/0.35) : mix(a, cc, clamp01((n-0.4)*2)); };
  const map = pixels(f); const bump = pixels((u,v) => { const [x,y,z] = cyl(u,v,70); return gray(clamp01(worley(x,y,z))); });
  return { map, bump, bumpScale: 1.5, mat: { roughness: 0.9 } };
};
R['bamboo'] = () => {
  const light = hex('#e1c27e'), dark = hex('#b8904c');
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,6); const s = Math.sin(2*Math.PI*(u*120 + fbm(x,y,z*0.2,3)*2)); let c = mix(light, dark, (0.5+0.5*s)*0.35 + fbm(x*4,y*4,z*0.3,2)*0.2); const node = Math.abs(((v*3.2) % 1) - 0.5); if (node < 0.012) c = mix(c, hex('#7d5a2a'), 0.8); return c; });
  return { map, bump: map, bumpScale: 0.35, mat: { roughness: 0.4, clearcoat: 0.4, clearcoatRoughness: 0.3 } };
};
R['paper'] = () => {
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,40); const n = fbm(x,y,z,4); const [a,b,c] = cyl(u,v,500); const fl = vnoise(a,b,c); let col = mix(hex('#c9a97c'), hex('#b18c5e'), n*0.7); if (fl > 0.85) col = mix(col, hex('#8a6a43'), 0.5); return col; });
  return { map, bump: map, bumpScale: 0.5, mat: { roughness: 0.95 } };
};
R['felt'] = () => {
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,260); const n = fbm(x,y,z,3); const [a,b,c] = cyl(u,v,700); const fl = vnoise(a,b,c); let col = mix(hex('#3f4247'), hex('#5c6067'), n); if (fl > 0.82) col = mix(col, hex('#8e939a'), 0.7); if (fl < 0.15) col = mix(col, hex('#2a2c30'), 0.6); return col; });
  return { map, bump: map, bumpScale: 1.6, mat: { roughness: 1, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color('#8a9099') } };
};
R['woven'] = () => {
  const N = 64, M = 32, c = canvas(), ctx = c.getContext('2d'); const cw = TW / N, ch = TH / M;
  ctx.fillStyle = '#2d3e56'; ctx.fillRect(0,0,TW,TH);
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const over = (i + j) % 2 === 0; const x = i*cw, y = j*ch;
    const g = ctx.createLinearGradient(over ? x : x, over ? y : y, over ? x : x + cw, over ? y + ch : y);
    g.addColorStop(0, '#2b3b52'); g.addColorStop(0.5, '#5a7396'); g.addColorStop(1, '#2b3b52'); ctx.fillStyle = g; ctx.fillRect(x+0.5, y+0.5, cw-1, ch-1); }
  return { map: c, bump: c, bumpScale: 0.8, mat: { roughness: 0.9, sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color('#9fb3d1') } };
};
R['knit'] = () => {
  const N = 44, M = 34, c = canvas(), ctx = c.getContext('2d'); const cw = TW / N, ch = TH / M; ctx.fillStyle = '#7a2f3a'; ctx.fillRect(0,0,TW,TH);
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const x = i*cw, y = j*ch;
    for (const side of [-1, 1]) { ctx.save(); ctx.translate(x + cw/2 + side*cw*0.22, y + ch/2); ctx.rotate(side * 0.5); const g = ctx.createRadialGradient(0,0,0,0,0,cw*0.5); g.addColorStop(0,'#c0566a'); g.addColorStop(1,'#6b2431'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,cw*0.26,ch*0.75,0,0,Math.PI*2); ctx.fill(); ctx.restore(); } }
  return { map: c, bump: c, bumpScale: 1.0, mat: { roughness: 0.95, sheen: 0.7, sheenRoughness: 0.5, sheenColor: new THREE.Color('#e08a99') } };
};
R['pile'] = () => {
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,420); const n = fbm(x,y,z,3); const [a,b,c] = cyl(u,v,30); const m = fbm(a,b,c,3); return mix(hex('#7a5235'), hex('#c99a70'), clamp01(n*0.75 + m*0.45 - 0.1)); });
  return { map, bump: map, bumpScale: 2.2, mat: { roughness: 1, sheen: 1, sheenRoughness: 0.3, sheenColor: new THREE.Color('#f0c9a6') } };
};
R['yarn'] = () => {
  const c = canvas(), ctx = c.getContext('2d'); ctx.fillStyle = '#b9a07a'; ctx.fillRect(0,0,TW,TH); const r = rng(5);
  for (let k = 0; k < 420; k++) { const phase = r()*Math.PI*2, amp = 40 + r()*180, y0 = r()*TH, per = 1 + Math.floor(r()*3), t = 175 + r()*60;
    ctx.strokeStyle = `rgb(${t+20},${t},${t*0.8})`; ctx.lineWidth = 3 + r()*2; ctx.beginPath();
    for (let x = 0; x <= TW; x += 4) { const y = y0 + Math.sin(phase + per*2*Math.PI*x/TW)*amp; x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
  return { map: c, bump: c, bumpScale: 1.4, mat: { roughness: 0.95, sheen: 0.6, sheenRoughness: 0.5, sheenColor: new THREE.Color('#f3e6cc') } };
};
R['leather'] = () => {
  const map = pixels((u, v) => { const [x,y,z] = cyl(u,v,120); const w = worley(x,y,z); const n = fbm(x*0.05,y*0.05,z*0.05,3); return mix(mix(hex('#5e3317'), hex('#8a4f26'), clamp01(w*1.6)), hex('#9c6034'), n*0.3); });

  return { map, bump, bumpScale: 0.9, mat: { roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.5 } };
};
R['soft-foam'] = () => {
  const bump = pixels((u,v) => { const [x,y,z] = cyl(u,v,160); const w = worley(x,y,z); return gray(clamp01(w*1.8)); });
  const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,160); const w = worley(x,y,z); return mix(hex('#c7b56a'), hex('#efe2a2'), clamp01(w*1.8)); });
  return { map, bump, bumpScale: 2.2, mat: { roughness: 1 } };
};
R['rigid-foam'] = () => {
  const bump = pixels((u,v) => { const [x,y,z] = cyl(u,v,55); const w = worley(x,y,z); return gray(clamp01(1 - Math.pow(Math.max(0, 0.62 - w)*1.6, 2))); });
  const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,55); const w = worley(x,y,z); return w > 0.58 ? hex('#d9d9d6') : hex('#f7f7f4'); });
  return { map, bump, bumpScale: 1.4, mat: { roughness: 0.85 } };
};
R['rubber'] = () => { const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,200); return mix(hex('#2a2b2d'), hex('#3a3c3f'), fbm(x,y,z,3)); }); return { map, bump: map, bumpScale: 0.15, mat: { roughness: 0.7 } }; };
R['gloss-plastic'] = () => ({ color: '#d2342c', mat: { roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05 } });
R['matte-plastic'] = () => { const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,260); return mix(hex('#7e9bb0'), hex('#8aa6ba'), fbm(x,y,z,2)); }); return { map, bump: map, bumpScale: 0.12, mat: { roughness: 0.75 } }; };
R['clear'] = () => ({ color: '#f4fbfa', mat: { roughness: 0, transmission: 1, thickness: 1.5, ior: 1.5, attenuationColor: new THREE.Color('#c6e6df'), attenuationDistance: 2.2, specularIntensity: 1, envMapIntensity: 1.6 } });
R['translucent'] = () => ({ color: '#cfe0ec', mat: { roughness: 0.55, transmission: 0.85, thickness: 2, ior: 1.45, attenuationColor: new THREE.Color('#a9c6dc'), attenuationDistance: 1.2 } });
R['film'] = () => { const bump = pixels((u,v) => { const [x,y,z] = cyl(u,v,8); return gray(fbm(x,y,z,5)); }); return { color: '#eef3f6', bump, bumpScale: 9, mat: { roughness: 0.12, transmission: 0.9, thickness: 0.1, ior: 1.4, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 600], envMapIntensity: 1.8 } }; };
R['brushed-metal'] = () => { const map = pixels((u,v) => { const n = vnoise(u*3, v*TH*0.9, 0.5)*0.6 + vnoise(u*40, v*TH*2.1, 3.3)*0.4; return mix(hex('#c4c8cc'), hex('#e2e5e8'), n); }); return { map, bump: map, bumpScale: 0.08, mat: { metalness: 1, roughness: 0.36, envMapIntensity: 2.4 } }; };
R['warm-metal'] = () => ({ color: '#e8bd6e', mat: { metalness: 1, roughness: 0.24, envMapIntensity: 2.6 } });
R['fibre-composite'] = () => {
  const N = 72, M = 36, c = canvas(), ctx = c.getContext('2d'); const cw = TW / N, ch = TH / M; ctx.fillStyle = '#151517'; ctx.fillRect(0,0,TW,TH);
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const h = Math.floor((i + j) / 2) % 2 === 0; const x = i*cw, y = j*ch;
    const g = h ? ctx.createLinearGradient(x, y, x, y+ch) : ctx.createLinearGradient(x, y, x+cw, y); g.addColorStop(0,'#141416'); g.addColorStop(0.5,'#4a4c52'); g.addColorStop(1,'#141416'); ctx.fillStyle = g; ctx.fillRect(x+0.5,y+0.5,cw-1,ch-1); }
  return { map: c, bump: c, bumpScale: 0.3, mat: { roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.05 } };
};
R['stone'] = () => {
  const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,30); const n = fbm(x,y,z,5); const [a,b,cc] = cyl(u,v,260); const pore = worley(a,b,cc) < 0.12; let col = mix(hex('#7d7b76'), hex('#a9a69f'), n); return pore ? mix(col, hex('#4a4845'), 0.8) : col; });
  return { map, bump: map, bumpScale: 0.8, mat: { roughness: 0.92 } };
};
R['ceramic'] = () => { const map = pixels((u,v) => { const [x,y,z] = cyl(u,v,10); return mix(hex('#f4f2ec'), hex('#e6e2d8'), fbm(x,y,z,3)); }); return { map, mat: { roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.03 } }; };
R['bio-composite'] = () => { // mycelium & bio-based: mottled off-white with fibrous flecks
  const c = pixels((u,v) => { const [x,y,z] = cyl(u,v,25); const n = fbm(x,y,z,5); return mix(hex('#e9e1cf'), hex('#cdbf9f'), clamp01(n*1.2-0.2)); });
  const ctx = c.getContext('2d'), r = rng(9);
  for (let i = 0; i < 900; i++) { const x = r()*TW, y = r()*TH, len = 6+r()*18, a = r()*Math.PI*2; wrapStroke(ctx, () => { ctx.strokeStyle = `rgba(${120+r()*50},${95+r()*30},${55+r()*20},0.75)`; ctx.lineWidth = 1.5+r()*2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*len, y+Math.sin(a)*len); ctx.stroke(); }); }
  return { map: c, bump: c, bumpScale: 1.3, mat: { roughness: 0.95 } };
};
R['natural-fibre-composite'] = () => { // pressed flax/hemp in plastic: flat fibrous browns, satin
  const c = canvas(), ctx = c.getContext('2d'); ctx.fillStyle = '#7b6038'; ctx.fillRect(0,0,TW,TH); const r = rng(13);
  for (let i = 0; i < 3500; i++) { const x = r()*TW, y = r()*TH, len = 30+r()*90, a = r()*Math.PI*2, t = 120+r()*90;
    wrapStroke(ctx, () => { ctx.strokeStyle = `rgba(${t+30},${t+5},${t*0.55},0.8)`; ctx.lineWidth = 1+r()*2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*len, y+Math.sin(a)*len); ctx.stroke(); }); }

};
R['glass-fibre-mat'] = null; // not used

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffffff');
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100); camera.position.set(0, 0.45, 5.6); camera.lookAt(0, -0.12, 0);
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(-0.8, 6, 1.2); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 18; key.shadow.blurSamples = 24; Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 20 }); scene.add(key);

const geo = new THREE.SphereGeometry(1, 192, 128);
let mesh = null;

window.renderLook = (slug) => {
  if (mesh) { scene.remove(mesh); mesh.material.dispose(); }
  const spec = R[slug](); const p = { color: spec.color || '#ffffff', ...spec.mat };
  const tex = (c, srgb) => { const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  if (spec.map) p.map = tex(spec.map, true);
  if (spec.bump) { p.bumpMap = tex(spec.bump, false); p.bumpScale = (spec.bumpScale || 1) * 0.6; }

window.looks = Object.keys(R).filter(k => R[k]);
window.ready = true;
</script></body></html>
